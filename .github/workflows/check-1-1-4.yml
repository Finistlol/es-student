name: 1.1.4 Создание репозитория курса

# Фильтра по путям здесь нет намеренно: проверка разбирает весь список файлов
# репозитория — ищет директорию build и результаты сборки где угодно, а не в
# одной папке.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-1-1-4.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}